[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invLocAd"
version = "0.4.0"
description = "invLocAd simulations and reproducible locomotor adaptation analyses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Inseung Kang"},
  {name = "Kanishka Mitra"},
  {name = "Nidhi Seethapathi"},
]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "pandas>=2.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]
excel = ["openpyxl>=3.1,<4"]

[project.scripts]
invLocAd-simulate = "invLocAd.cli:main"
invLocAd-publication = "invLocAd.publication.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"invLocAd.publication" = ["*.m", "vendor/*.m"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires the prepared publication data or MATLAB"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/invLocAd/**" = ["N999"]

